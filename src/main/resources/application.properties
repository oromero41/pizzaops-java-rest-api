spring.application.name=pizzaops
server.port=8080
management.endpoints.web.exposure.include=health,info
server.error.include-message=never

# PostgreSQL on user's computer. Keep passwords in environment variables, never in Git.
spring.datasource.url=jdbc:postgresql://localhost:5432/pizzaops
spring.datasource.username=${PIZZAOPS_DB_USER:postgres}
spring.datasource.password=${PIZZAOPS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
